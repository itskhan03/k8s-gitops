apiVersion: v1
data:
  logback.xml: |
    <?xml version="1.0" encoding="UTF-8"?>
    <configuration>
        <appender name="STDOUT" class="ch.qos.logback.core.ConsoleAppender">
            <encoder>
                <pattern>[%d{dd-MM-yyyy HH:mm:ss.SSS}] [%X{transaction_id}] [%X{device_id}] %highlight(%-5level) %logger{36}.%M - %msg %n</pattern>
            </encoder>
        </appender>

        <appender name="FILE" class="ch.qos.logback.core.rolling.RollingFileAppender">
            <rollingPolicy class="ch.qos.logback.core.rolling.TimeBasedRollingPolicy">
                <!-- Daily rollover -->
                <fileNamePattern>log/transaction.%d{yyyy-MM-dd}.log</fileNamePattern>
            </rollingPolicy>
            <encoder>
                <pattern>[%d{dd-MM-yyyy HH:mm:ss.SSS}] [%X{transaction_id}] [%X{device_id}] %highlight(%-5level) %logger{36}.%M - %msg %n</pattern>
            </encoder>
        </appender>
        <root level="info">
            <appender-ref ref="STDOUT" />
            <appender-ref ref="FILE" />
        </root>
    </configuration>
kind: ConfigMap
metadata:
  creationTimestamp: null
  name: transaction-logback-config
